name: Banking CI/CD

on:
  push:
    branches:
      - cicd-feature

  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: demo
  ECS_CLUSTER: banking-cicd-cluster
  ECS_SERVICE: banking-cicd-service

jobs:

  build-and-deploy:
    runs-on: ubuntu-latest
    environment: dev

    steps:

      # 1. Checkout source code
      - name: Checkout code
        uses: actions/checkout@v4


      # 2. Setup Java 21
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: demo/pom.xml


      # 3. Build Spring Boot application
      - name: Build application
        working-directory: ./demo
        run: |
          mvn clean package -DskipTests
          

    
      # 4. Configure AWS using GitHub OIDC
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}


      # 5. Login to Amazon ECR
      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2


      # 6. Set Docker image
      - name: Set Docker image
        id: image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          IMAGE=$ECR_REGISTRY/$ECR_REPOSITORY:${{ github.sha }}
          echo "image=$IMAGE" >> $GITHUB_OUTPUT
          echo "Docker image: $IMAGE"


      # 7. Build Docker image
      - name: Build Docker image
        env:
          IMAGE: ${{ steps.image.outputs.image }}
        run: |
          docker build \
            -t $IMAGE \
            ./demo


      # 8. Push Docker image to ECR
      - name: Push Docker image
        env:
          IMAGE: ${{ steps.image.outputs.image }}
        run: |
          docker push $IMAGE


      # 9. Get current ECS task definition
      - name: Get current task definition
        id: task-def
        run: |
          TASK_DEFINITION_ARN=$(aws ecs describe-services \
            --cluster $ECS_CLUSTER \
            --services $ECS_SERVICE \
            --query 'services[0].taskDefinition' \
            --output text)

          echo "Current task definition: $TASK_DEFINITION_ARN"

          aws ecs describe-task-definition \
            --task-definition $TASK_DEFINITION_ARN \
            --query 'taskDefinition' \
            --output json > task-definition.json


      # 10. Update container image
      - name: Update task definition image
        env:
          IMAGE: ${{ steps.image.outputs.image }}
        run: |
          jq --arg IMAGE "$IMAGE" \
            '.containerDefinitions[0].image = $IMAGE |
             del(
               .taskDefinitionArn,
               .revision,
               .status,
               .requiresAttributes,
               .compatibilities,
               .registeredAt,
               .registeredBy
             )' \
            task-definition.json > new-task-definition.json

          echo "New task definition:"
          cat new-task-definition.json


      # 11. Register new ECS task definition
      - name: Register ECS task definition
        id: register-task
        run: |
          NEW_TASK_DEFINITION=$(aws ecs register-task-definition \
            --cli-input-json file://new-task-definition.json \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)

          echo "task_definition=$NEW_TASK_DEFINITION" >> $GITHUB_OUTPUT

          echo "New task definition: $NEW_TASK_DEFINITION"


      # 12. Deploy new task definition to ECS
      - name: Deploy to ECS
        env:
          TASK_DEFINITION: ${{ steps.register-task.outputs.task_definition }}
        run: |
          aws ecs update-service \
            --cluster $ECS_CLUSTER \
            --service $ECS_SERVICE \
            --task-definition $TASK_DEFINITION


      # 13. Wait for ECS deployment
      - name: Wait for ECS deployment
        run: |
          aws ecs wait services-stable \
            --cluster $ECS_CLUSTER \
            --services $ECS_SERVICE


      # 14. Deployment successful
      - name: Deployment successful
        env:
          IMAGE: ${{ steps.image.outputs.image }}
        run: |
          echo "========================================="
          echo "Deployment completed successfully!"
          echo "Branch: ${{ github.ref_name }}"
          echo "Commit: ${{ github.sha }}"
          echo "Docker image: $IMAGE"
          echo "ECS Cluster: $ECS_CLUSTER"
          echo "ECS Service: $ECS_SERVICE"
          echo "========================================="